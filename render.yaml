databases:
  - name: ticketmaster-db
    region: oregon
    plan: free
    databaseName: ticketmaster
    user: ticketmaster
    ipAllowList: []

services:
  - type: web
    name: ticketmaster-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ticketmaster-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ticketmaster-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ticketmaster-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: HOLD_TTL_SECONDS
        value: "300"
      - key: HOLD_SWEEP_INTERVAL_MS
        value: "5000"
