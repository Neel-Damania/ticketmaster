spring.application.name=ticketMaster
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketmaster}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticketmaster}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticketmaster}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:7f3c9a1e8b6d4f2a0c5e7b9d3f1a6c8e4b2d9f7a5c1e8b6d3a0f9c7e2b4d6a1}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
hold.ttl-seconds=${HOLD_TTL_SECONDS:300}
hold.sweep-interval-ms=${HOLD_SWEEP_INTERVAL_MS:5000}
hold.sweep-batch=1000
management.endpoints.web.exposure.include=health,info,prometheus
# logging.structured.format.console=logstash
server.tomcat.max-connections=10000
server.tomcat.accept-count=5000
server.tomcat.keep-alive-timeout=120s
server.tomcat.max-keep-alive-requests=-1
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
reservation.db-concurrency=16
