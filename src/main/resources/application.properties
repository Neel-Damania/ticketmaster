spring.application.name=ticketMaster
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketmaster}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticketmaster}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticketmaster}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:7f3c9a1e8b6d4f2a0c5e7b9d3f1a6c8e4b2d9f7a5c1e8b6d3a0f9c7e2b4d6a1}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
hold.ttl-seconds=${HOLD_TTL_SECONDS:300}
hold.sweep-interval-ms=${HOLD_SWEEP_INTERVAL_MS:5000}
hold.sweep-batch=1000
management.endpoints.web.exposure.include=health,info,prometheus
# logging.structured.format.console=logstash
spring.threads.virtual.enabled=true
server.tomcat.max-connections=30000
server.tomcat.accept-count=10000